apply plugin: 'com.android.application'

def releaseKeystorePropertiesFile = rootProject.file('release/keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))
}

android {
    compileSdk = 37
    defaultConfig {
        applicationId = "io.github.kennethchoinfosec.haven"
        minSdk = 24
        targetSdk = 37
        versionCode = 9
        versionName = "0.1.5"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (!releaseKeystoreProperties.isEmpty()) {
            release {
                storeFile = rootProject.file("release/${releaseKeystoreProperties['storeFile']}")
                storePassword = releaseKeystoreProperties['storePassword']
                keyAlias = releaseKeystoreProperties['keyAlias']
                keyPassword = releaseKeystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (!releaseKeystoreProperties.isEmpty()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'GoogleAppIndexingWarning', 'InvalidFragmentVersionForActivityResult'
    }
    buildFeatures {
        aidl = true
    }
    namespace = 'io.github.kennethchoinfosec.haven'
}

// Never produce a release APK that Android will sign with a temporary debug key or leave
// unsigned. Debug builds remain available without the private release credentials.
tasks.configureEach { task ->
    if (task.name == 'packageRelease' || task.name == 'bundleRelease') {
        task.doFirst {
            if (releaseKeystoreProperties.isEmpty()) {
                throw new GradleException('Release signing is required. Configure release/keystore.properties; see docs/RELEASING.md.')
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.activity
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.viewpager2
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.espresso
}
